name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Afterglow.xcodeproj \
            -scheme Afterglow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Afterglow.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Afterglow.xcarchive/Products/Applications/Afterglow.app build/Payload/
          cd build && zip -qry Afterglow.ipa Payload && ls -lh Afterglow.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Afterglow-ipa
          path: build/Afterglow.ipa

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest build/Afterglow.ipa --prerelease \
            --title "Afterglow 最新构建 (${GITHUB_SHA::7})" \
            --notes "main 分支自动构建的未签名 IPA，需用 AltStore / Sideloadly / TrollStore 等工具自签安装。"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Afterglow.ipa --title "Afterglow $GITHUB_REF_NAME" --generate-notes
