name: Afterglow
options:
  bundleIdPrefix: com.iskerwin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Afterglow:
    type: application
    platform: iOS
    sources:
      - path: Afterglow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iskerwin.afterglow
        PRODUCT_NAME: Afterglow
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Afterglow/Resources/Info.plist
      properties:
        CFBundleDisplayName: 霞光
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: 霞光需要你的位置来预测当地的朝霞、晚霞和火烧云。
        ITSAppUsesNonExemptEncryption: false
